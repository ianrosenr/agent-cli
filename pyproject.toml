[project]
name = "agent-cli"
version = "0.1.0"
description = "A local-first orchestration and routing control plane for coding agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "keyring>=25.7.0",
    "prompt_toolkit>=3.0",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
agent-cli = "agent_cli.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cli"]

[tool.hatch.build.targets.wheel.force-include]
"builtins" = "agent_cli/builtins"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
