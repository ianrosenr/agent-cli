[project]
name = "agent-cli"
version = "0.1.0"
description = "A local-first orchestration and routing control plane for coding agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["prompt_toolkit>=3.0"]

[project.scripts]
agent-cli = "agent_cli.cli:main"

[dependency-groups]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
