# Machine-readable skill-routing policy. Parsed and validated by agent_cli.skills.policy;
# never injected into worker prompts. See docs/SKILL_ROUTING.md.
version: 3

# Allow rerouting when a worker discovers work in an uncovered policy domain.
# Adding a skill never expands the worker's role authority.
dynamic_escalation: true

# The normalized signal vocabulary: the only signal IDs a classifier may emit or repository facts
# may derive. Signals describe what the work involves; they are NOT prompt keywords or skill names.
signals: [
    acceptance_criteria, agent_instruction_change, ambiguity, artifact_review, async_work,
    auth_change, authentication, authorization, backfill, background_job, behavior_change,
    benchmark, benchmark_research, bugfix, capability_added, capability_changed,
    capability_removed, ci_cd, cli_interface, code_review, component_boundary, concurrency,
    concurrency_architecture, concurrency_change, context_policy, credential, critical_outcome,
    cryptography, data_architecture, database, database_query, dependency, dependency_change,
    deployment, deployment_topology, deserialization, directory_reorganization,
    distributed_operation, documentation_change, environment_config, environment_setup,
    error_handling, evaluation_change, event_schema, external_event, external_input,
    external_research, external_service, failure_path, feature_flag, filesystem, future_work,
    golden_dataset_change, health_check, http_api, index, interface_change,
    irreversible_decision, latency, latency_budget, lockfile, long_running_operation, mcp,
    migration, model_selection_policy_change, multi_subsystem_feature, network, network_call,
    new_package, new_service, new_skill, new_subsystem, package_management,
    performance_requirement, persistence, persistence_change, privilege, public_config,
    public_interface, public_protocol, queue, release, request_path, requirement_change,
    resource_optimization, resource_pool, retry, rollout, routing_policy_change,
    runtime_version, schema, sdk, secret, serialization, shell_execution, skill_change,
    skill_metadata, skill_structure, spec_review, specification, state_transition,
    system_prompt_change, technical_research, technology_evaluation, throughput,
    throughput_target, timeout, tool_contract_change, transaction, trust_boundary
]

# Roles define authority. These are the required baseline skills for each role.
# No skill is global to every worker.
role_defaults:
  orchestrator: []
  spec_author: [specification]
  spec_reviewer: [review, specification]
  architect: [architecture]
  implementer: [software-engineering, testing]
  code_reviewer: [review, software-engineering]
  research_investigator: [research]
  security_investigator: [security]
  skill_author: [creating-a-new-skill]
  skill_evaluator: [skill-evaluation]

# Deterministic signals derived from V1-05 RepositoryFacts, without a model.
# `categories` match path categories; `facts` match repository signal facts (from imports).
# Strong evidence outranks classifier signals when the context budget forces a choice; weak
# evidence ranks below them.
repository_signals:
  categories:
    migration: {signals: [migration, schema], strength: strong}
    ci: {signals: [ci_cd], strength: strong}
    deployment: {signals: [deployment], strength: strong}
    dependency_manifest: {signals: [dependency_change], strength: strong}
    documentation: {signals: [documentation_change], strength: weak}
  facts:
    http_api: {signals: [http_api, request_path], strength: strong}
    migration: {signals: [migration], strength: strong}
    authentication: {signals: [authentication], strength: strong}
    database: {signals: [database], strength: weak}
    cache_store: {signals: [external_service], strength: weak}
    http_client: {signals: [network_call], strength: weak}
    retries: {signals: [retry], strength: weak}
    process_execution: {signals: [shell_execution], strength: weak}
    concurrency: {signals: [concurrency], strength: weak}

# A non-default skill becomes eligible when at least one of its signals is detected. The order of
# this mapping is the tie-breaker when two matches have the same evidence strength.
skills:
  specification:
    signals: [specification, requirement_change, acceptance_criteria, ambiguity]
  architecture:
    signals: [component_boundary, data_architecture, trust_boundary, concurrency_architecture, deployment_topology, public_protocol, external_event, irreversible_decision, multi_subsystem_feature]
  research:
    signals: [technical_research, external_research, benchmark_research, technology_evaluation]
  interfaces:
    signals: [http_api, cli_interface, sdk, mcp, event_schema, public_config, serialization, public_interface]
  data:
    signals: [database, persistence, schema, migration, transaction, backfill, index]
  security:
    signals: [external_input, authentication, authorization, secret, credential, database_query, filesystem, network, deserialization, shell_execution, privilege, cryptography, trust_boundary]
  resilience:
    signals: [network_call, external_service, background_job, queue, retry, timeout, concurrency, async_work, distributed_operation, transaction, resource_pool, long_running_operation]
  observability:
    signals: [request_path, background_job, dependency, state_transition, failure_path, retry, queue, latency, throughput, critical_outcome]
  testing:
    signals: [behavior_change, bugfix, interface_change, persistence_change, auth_change, concurrency_change, error_handling, dependency_change, code_review]
  dependencies:
    signals: [dependency_change, environment_setup, package_management, lockfile, runtime_version]
  performance:
    signals: [performance_requirement, latency_budget, throughput_target, resource_optimization, benchmark]
  delivery:
    signals: [deployment, ci_cd, rollout, feature_flag, health_check, release, environment_config]
  review:
    signals: [artifact_review, spec_review, code_review]
  repository-context:
    signals: [new_service, new_package, new_subsystem, directory_reorganization, context_policy]
  repository-state:
    signals: [capability_added, capability_removed, capability_changed, future_work, documentation_change]
  creating-a-new-skill:
    signals: [new_skill, skill_metadata, skill_structure]
  skill-evaluation:
    signals: [skill_change, system_prompt_change, agent_instruction_change, routing_policy_change, model_selection_policy_change, tool_contract_change, evaluation_change, golden_dataset_change]
