# Agent CLI model registry: capability facts per canonical model. See docs/ROUTING.md.
#
# Scores are integers 1-5 (1 weak, 2 usable for bounded work, 3 competent, 4 strong,
# 5 exceptional). Every entry names the evidence for its scores in `sources`. Never infer
# scores from a model's name, vendor, size, latency, or price, and never add an entry just to
# fill the registry: models without evidence-backed scores stay out until they have them.
#
# Provider access paths are not listed here; provider adapters report them at runtime.
#
# Entry shape:
#
#   - id: canonical-model-id
#     display_name: Human Name
#     status: active              # active | candidate (never selected automatically)
#     scores:
#       reasoning: 3
#       coding: 3
#       repository_engineering: 3
#       debugging: 3
#       tool_use: 3
#       architecture: 3
#       security_reasoning: 3
#     latency: fast               # fast | medium | slow
#     cost: low                   # free | low | medium | high (coarse hint, not pricing)
#     confidence: medium          # low | medium | high
#     sources:
#       - concise evidence label
#     aliases: []                 # other IDs providers report this model as

version: 2
models:
  # Conservative, reviewed scores: enough for the orchestrator, spec_author, architect, and
  # research floors (4), deliberately not the high security floor. No 5 without independent
  # evaluation evidence.
  - id: claude-sonnet-5-5
    display_name: Claude Sonnet 5.5
    status: active
    scores:
      reasoning: 4
      coding: 4
      repository_engineering: 4
      debugging: 4
      tool_use: 4
      architecture: 4
      security_reasoning: 3
    latency: fast
    cost: medium
    confidence: medium
    sources:
      - "Anthropic models overview, reviewed 2026-10-31: https://platform.claude.com/docs/en/models/overview"
      - "Anthropic Claude Sonnet 5.5 model page: https://platform.claude.com/docs/en/models/sonnet-5-5/overview"
    aliases: []
